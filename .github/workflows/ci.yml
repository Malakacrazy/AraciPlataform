name: CI

# Bloqueador 07 da auditoria, etapa 1 da sequência recomendada: "provar
# que o monorepo compila fora do Windows" antes de qualquer decisão de
# hospedagem. Este código nunca tinha rodado em CI -- apps/web tem
# strict: true e nunca desliga erro de build, então isso remove a maior
# incógnita da lista de bloqueadores.
on:
  push:
    branches: [main]
  pull_request:

# Achado A17 da auditoria de 30 ago 2026: sem isto, o GITHUB_TOKEN deste
# workflow herdava as permissões default do repositório/organização, que
# podem ser mais amplas que "ler o código" -- este job nunca precisa
# escrever nada. Mesmo padrão que pr-visual-recap.yml já declara.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Instalar, gerar, buildar, typecheck
    runs-on: ubuntu-latest
    env:
      # Só pra gerar o Prisma Client e satisfazer datasource.url em
      # prisma.config.ts -- nenhum passo deste workflow conecta de
      # verdade num banco.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Build (packages/db, apps/api, apps/web)
        run: npx turbo run build

      - name: Typecheck apps/api
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Typecheck apps/web
        run: npx tsc --noEmit
        working-directory: apps/web

      # Achado A17 da auditoria de 30 ago 2026: nenhum passo deste
      # workflow rodava jest -- apps/api/src/crm/pricing.spec.ts e
      # apps/api/src/office/google-drive.service.spec.ts (entre outros)
      # existiam, passavam localmente, e nada os executava em CI. Um PR
      # quebrando a precificação ou o GoogleDriveService compilava e
      # typechecava limpo, então o merge acontecia. `test` já é uma task
      # declarada em turbo.json (dependsOn: ^build); testes unitários, não
      # o smoke-test de 355 checks (esse exige Postgres + API de pé, fora
      # de escopo desta rodada).
      - name: Testes
        run: npx turbo run test

      # Deriva entre código e manifesto de deploy não quebra build nem
      # typecheck -- o deploy sobe e a feature só não funciona. Já
      # aconteceu: o render.yaml ficou 7 variáveis atrás do código sem
      # nada acusar. Roda depois do build porque é barato e o sinal
      # interessa mesmo quando o build passa.
      - name: Conferir manifestos de deploy contra o código
        run: npm run check:deploy-config
