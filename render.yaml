# Bloqueadores 07/13 da auditoria: não existia nenhum caminho de
# publicação nem banco de produção declarado em lugar nenhum. Este
# blueprint segue a recomendação da própria auditoria (Render) pelo
# motivo que ela documenta, não por preferência: apps/api precisa ser um
# serviço PRIVADO (apps/web fala com ele por http:// simples carregando
# INTERNAL_API_SECRET em texto claro -- só é seguro numa rede interna,
# nunca com os dois hosts públicos), e o estúdio tem dois requisitos
# incomuns que restringem a escolha de provedor: um segredo em forma de
# ARQUIVO (o .pfx do certificado A1) e um volume persistente pro XML
# fiscal autorizado. Render atende os dois nativamente, sem refatorar o
# código fiscal.
#
# Banco: Supabase (projeto que a conta já tem, usado pro Realtime do
# quadro -- ver lib/supabaseRealtime.ts), não o Postgres gerenciado do
# Render. Decisão custo/risco, não técnica: rodar tudo no Render ficaria
# ~$20/mês (Postgres + api + web, todos "starter"); reaproveitando o
# Supabase existente sobra só o custo do api (~$7/mês, inevitável --
# serviço privado não tem instância grátis no Render). Free tier do
# Supabase pausa depois de uma semana de baixa atividade (restaurável por
# até 1 ano), não deleta com prazo fixo como o Free do próprio Render
# (30 dias + 14 de carência, depois apaga os dados) -- e um app com uso
# de verdade durante o expediente dificilmente fica uma semana inteira
# sem nenhum acesso. DATABASE_URL entra como `sync: false` abaixo
# (Supabase → Project Settings → Database → Connection string).
# IMPORTANTE (corrigido -- achados A11/A15 da auditoria de 30 ago 2026,
# docs/auditoria-2026-08-30-detalhada.md): usar a connection string do
# POOLER, não a direta (porta 5432 do host db.<ref>.supabase.co). O
# endpoint direto só resolve em IPv6 sem o add-on IPv4 pago do Supabase,
# e a saída de rede do Render é IPv4 -- essa combinação nem chega a
# tentar conectar. SEMPRE com `?sslmode=require` no final -- pg tem
# ssl:false por padrão e a string do painel do Supabase não traz sslmode
# nenhum; packages/db/src/index.ts falha no boot se isso faltar num host
# remoto.
#
# DUAS strings do pooler, não uma (achado rodando de verdade, 01 set
# 2026 -- a versão anterior deste comentário achava que uma bastava, e
# estava errada): o pooler Supavisor tem dois modos no MESMO host,
# diferenciados só pela porta.
#   - DATABASE_URL: modo TRANSACTION (porta 6543) -- pro app RODANDO
#     (packages/db/src/index.ts, via @prisma/adapter-pg). Muitas conexões
#     curtas, é pra isso que pooler serve.
#   - DIRECT_URL: modo SESSION (porta 5432, MESMO host do pooler, não o
#     host direto do Supabase) -- só pro CLI de migração
#     (packages/db/prisma.config.ts). prisma migrate deploy trava
#     indefinidamente contra o modo transaction: esse modo não suporta os
#     prepared statements/locks de sessão que o motor de migração do
#     Prisma precisa (github.com/prisma/prisma/issues/22779). Modo
#     session resolve em IPv4 igual o de transaction -- não é o mesmo
#     problema do endpoint direto do parágrafo acima.
#
# Escrito sem acesso a uma conta Render de verdade -- já rodou contra
# uma de verdade uma vez (01 set 2026) e pegou um campo inválido:
# `secretFiles` não existe no Blueprint spec (corrigido abaixo, ver
# comentário no serviço araci-api). O resto do arquivo segue sem
# validação end-to-end -- o campo de build args pra Docker
# especificamente (NEXT_PUBLIC_* precisam existir em tempo de build, não
# runtime) é o próximo ponto mais provável de precisar ajuste fino
# direto no dashboard na hora de configurar de verdade.
services:
  # Privado -- nunca deve ter domínio público. Ver comentário no topo.
  - type: pserv
    name: araci-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: starter
    # CORRIGIDO: healthCheckPath não existe pra type: pserv (achado
    # rodando de verdade -- "pserv service type cannot have a health
    # check path"). GET /health continua existindo no código
    # (apps/api/src/app.controller.ts) e serve pra chamada manual/
    # monitoramento externo se algum dia precisar, só não é algo que o
    # Render possa checar sozinho num serviço privado.
    # prisma migrate deploy roda contra a MESMA imagem que vai pro ar,
    # depois do build e antes do serviço novo receber tráfego -- decisão
    # documentada no próprio Dockerfile (mantém as devDependencies na
    # imagem final exatamente pra isto funcionar sem job/init-container
    # separado).
    preDeployCommand: npm run db:migrate:deploy
    envVars:
      # Connection string do POOLER do Supabase em modo TRANSACTION
      # (porta 6543) com ?sslmode=require -- usada pelo app rodando via
      # @prisma/adapter-pg (packages/db/src/index.ts). Ver comentário no
      # topo do arquivo pro porquê (achados A11/A15 da auditoria de 30
      # ago 2026) e pro porquê o CLI de migração usa DIRECT_URL, não
      # esta.
      - key: DATABASE_URL
        sync: false
      # CORRIGIDO (01 set 2026, achado rodando de verdade): prisma
      # migrate deploy trava indefinidamente contra o pooler em modo
      # transaction acima -- esse modo não suporta os prepared
      # statements/locks de sessão que o motor de migração do Prisma
      # precisa. Pooler em modo SESSION (mesmo host, porta 5432, com
      # ?sslmode=require) resolve em IPv4 igual o de transaction (ao
      # contrário do endpoint direto do Supabase, que só resolve em IPv6
      # sem o add-on pago) e suporta sessão completa -- packages/db/
      # prisma.config.ts usa esta variável só pro CLI, nunca pro app
      # rodando.
      - key: DIRECT_URL
        sync: false
      - key: PORT
        value: 3001
      - key: INTERNAL_API_SECRET
        generateValue: true
      # Achado A12 da auditoria de 30 ago 2026: fromService/property:host
      # entrega o hostname SEM protocolo ("araci-web.onrender.com"), e o
      # código concatenava direto -- corrigido com um withScheme() nos
      # pontos de consumo (apps/api/src/common/url.ts,
      # apps/web/src/lib/url.ts), que prefixa http:// quando falta. Mantido
      # fromService (não sync: false) porque agora é seguro e continua
      # atualizando sozinho se o hostname interno mudar.
      - key: WEB_URL
        fromService:
          type: web
          name: araci-web
          property: host
      - key: ALLOWED_EMAIL_DOMAINS
        value: studioaraci.com.br
      - key: ALLOWED_EMAILS
        sync: false
      # sync: false, não generateValue (achado A13 da auditoria de 30 ago
      # 2026): generateValue produz base64 (~44 chars), mas
      # google-credential-crypto.ts exige hex de 32 bytes (64 chars) --
      # com generateValue, TODA integração Google quebra no primeiro uso
      # (loadKey() lança), não no boot. Gere com `openssl rand -hex 32`
      # e cole aqui, como .env.example já instrui.
      - key: GOOGLE_CREDENTIAL_ENCRYPTION_KEY
        sync: false
      # MESMO par OAuth declarado no serviço araci-web -- não é
      # duplicação por engano: GoogleCredentialsService.getAccessToken
      # troca o refresh_token guardado por um access_token pra chamar a
      # Drive API do servidor, sem depender do navegador estar aberto.
      # Estavam declaradas só no araci-web (achado do
      # scripts/check-deploy-config.mjs, que confere POR SERVIÇO -- uma
      # comparação contra o arquivo inteiro passa batido nisto). Sem elas
      # aqui, tudo que toca o Drive falha em produção.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Certificado, Asaas, ZapSign, Resend -- segredos reais, nunca um
      # valor aqui. sync:false = "configurar manualmente no dashboard",
      # nunca commitado neste arquivo (mesma disciplina de .env.example).
      - key: NFSE_CERTIFICATE_PATH
        value: /etc/secrets/StudioAraci.pfx
      - key: NFSE_CERTIFICATE_PASSWORD
        sync: false
      - key: NFSE_CERTIFICATE_UF
        value: SP
      - key: NFSE_CERTIFICATE_CPFCNPJ
        sync: false
      - key: ASAAS_ENV
        value: production
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_AUTH_TOKEN
        generateValue: true
      - key: ZAPSIGN_ENV
        value: production
      - key: ZAPSIGN_PRODUCTION_API_TOKEN
        sync: false
      - key: ZAPSIGN_WEBHOOK_AUTH_TOKEN
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
    # O .pfx nunca deve ser commitado (ver .gitignore, *.pfx/*.p12).
    # CORRIGIDO: `secretFiles` NÃO existe no Blueprint spec do Render
    # (achado rodando de verdade -- "field secretFiles not found in type
    # FileService" ao aplicar este blueprint; a nota no topo do arquivo já
    # avisava que isto nunca tinha sido testado contra uma conta real).
    # Secret Files são dashboard-only, sem equivalente em render.yaml:
    # depois que este serviço existir, subir manualmente em
    # araci-api → Environment → Secret Files, nome "StudioAraci.pfx".
    # Render monta todo Secret File em /etc/secrets/<nome> automaticamente
    # (path fixo, não configurável) -- é exatamente o que
    # NFSE_CERTIFICATE_PATH acima já assume.
    # XML autorizado da NFS-e precisa sobreviver a um redeploy -- não é
    # cache, é o comprovante fiscal.
    disk:
      name: araci-fiscal-xml
      mountPath: /data/fiscal
      sizeGB: 1

  # Público -- único serviço com domínio (plataforma.studioaraci.com.br).
  # `free`, não `starter`, por decisão explícita de custo: o `araci-api`
  # já é pago (serviço privado não tem instância grátis no Render, ver
  # comentário no topo do arquivo), então este é o único ponto onde dava
  # pra economizar sem virar risco de dado (diferente do banco, que tinha
  # prazo de expiração no free do Render -- por isso o Postgres é do
  # Supabase, não daqui). Contrapartida aceita: hiberna depois de 15min
  # sem tráfego, ~1min pra acordar na próxima requisição.
  - type: web
    name: araci-web
    runtime: docker
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Explícito em vez de depender do default implícito do Render
      # (10000 pra web services sem PORT declarado) -- ver comentário no
      # Dockerfile (EXPOSE corrigido pra bater com isto, 01 set 2026). Não
      # resolve por si só um achado real (deploy nº1 deste serviço: o app
      # subiu e escutou em 6s, mas o próprio detector de porta do Render
      # não percebeu por 15min até dar timeout e reiniciar sozinho -- ver
      # dashboard, "Detected service running on port 10000" só depois do
      # restart) -- mas remove a ambiguidade pra descartar isto como
      # causa em runs futuras.
      - key: PORT
        value: 10000
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: araci-web
          property: host
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_APP_ID
        sync: false
      # Sem protocolo (achado A12) -- ver comentário no WEB_URL do
      # araci-api acima pro porquê isso é seguro (withScheme()).
      - key: API_URL
        fromService:
          type: pserv
          name: araci-api
          property: hostport
      - key: INTERNAL_API_SECRET
        fromService:
          type: pserv
          name: araci-api
          envVarKey: INTERNAL_API_SECRET
      - key: ALLOWED_EMAIL_DOMAINS
        value: studioaraci.com.br
      - key: ALLOWED_EMAILS
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Embutido no bundle do cliente em tempo de build (ver comentário
      # sobre ARG no Dockerfile) -- mesmo DSN de SENTRY_DSN acima.
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
      # Login do convidado do quadro (OIDC do Logto) -- ver
      # api/quadro/authorize|callback. Faltavam aqui: este blueprint foi
      # escrito antes do quadro colaborativo existir e ninguém voltou pra
      # atualizar (achado conferindo render.yaml contra
      # `grep process.env` no apps/web). Sem eles, o convidado não
      # consegue entrar em produção.
      - key: LOGTO_ENDPOINT
        sync: false
      - key: LOGTO_APP_ID
        sync: false
      - key: LOGTO_APP_SECRET
        sync: false
      # Canal privado do Realtime (sincronização ao vivo do quadro). Os
      # dois NEXT_PUBLIC_* abaixo são CONGELADOS no bundle em tempo de
      # build -- precisam chegar como build arg pro Docker, não só como
      # env de runtime (ver ARG no apps/web/Dockerfile); setar só aqui e
      # esperar que funcione em runtime é justamente a armadilha.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      # Assina o JWT curto do canal privado -- segredo de servidor, nunca
      # NEXT_PUBLIC_. Exige também aplicar
      # docs/fase-0/supabase-realtime-policy.sql no projeto Supabase.
      - key: SUPABASE_JWT_SECRET
        sync: false
